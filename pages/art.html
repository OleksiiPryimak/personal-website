<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oleksii Pryimak | Artystyczne Malowanie & Murale</title>
    
    <!-- Czcionka i Ikony -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS W CAŁOŚCI NIEZALEŻNY OD STYLI GŁÓWNYCH */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Fira Code', monospace;
            min-height: 100vh;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Przycisk powrotu */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border: 1px solid #ff9f1c;
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .back-btn:hover {
            background-color: #ff9f1c;
            color: #000000;
            box-shadow: 0 0 15px #ff9f1c;
        }

        /* Nagłówek */
        .header-title {
            font-size: 2.5rem;
            color: #ff9f1c;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .header-desc {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* Siatka: 3 zdjęcia w rzędzie */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        /* Prostokątny kafelek ze zdjęciem */
        .gallery-card {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 159, 28, 0.3);
            background: #080808;
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%);
            transition: filter 0.3s ease, transform 0.3s ease;
            display: block;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            border-color: #ff9f1c;
            box-shadow: 0 0 20px rgba(255, 159, 28, 0.4);
        }

        .gallery-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        /* LIGHTBOX Z NAWIGACJĄ STRZAŁKAMI */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999999;
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 90vw;
            max-height: 85vh;
        }

        .lightbox-overlay img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
            border: 1px solid rgba(255, 159, 28, 0.5);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            object-fit: contain;
        }

        /* Przycisk zamknięcia */
        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 3rem;
            cursor: pointer;
            transition: color 0.3s ease;
            z-index: 1000001;
        }

        .lightbox-close:hover {
            color: #ff9f1c;
        }

        /* Strzałki Nawigacyjne (Poprzednie / Następne) */
        .lightbox-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid rgba(255, 159, 28, 0.5);
            color: #ff9f1c;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000001;
        }

        .lightbox-nav-btn:hover {
            background: #ff9f1c;
            color: #000000;
            box-shadow: 0 0 15px #ff9f1c;
        }

        .lightbox-prev {
            left: 25px;
        }

        .lightbox-next {
            right: 25px;
        }

        /* Responsywność */
        @media (max-width: 900px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .lightbox-nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
        }
        @media (max-width: 600px) {
            .gallery-grid { grid-template-columns: 1fr; }
            .header-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Przycisk Powrotu -->
        <a href="../index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Powrót do strony głównej
        </a>

        <!-- Nagłówek -->
        <header>
            <h1 class="header-title">Artystyczne Malowanie / Galeria</h1>
            <p class="header-desc">Wybrane projekty</p>
        </header>

        <!-- Galeria 3 zdjęcia w rzędzie -->
        <main class="gallery-grid" id="art-gallery"></main>
    </div>

    <!-- Niezależny Lightbox ze Strzałkami -->
    <div class="lightbox-overlay" id="lightbox">
        <button class="lightbox-close" id="lightbox-close" aria-label="Zamknij">&times;</button>
        
        <!-- Strzałka Poprzednie -->
        <button class="lightbox-nav-btn lightbox-prev" id="lightbox-prev" aria-label="Poprzednie zdjęcie">
            <i class="fas fa-chevron-left"></i>
        </button>

        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Powiększony obraz">
        </div>

        <!-- Strzałka Następne -->
        <button class="lightbox-nav-btn lightbox-next" id="lightbox-next" aria-label="Następne zdjęcie">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <script>
        const artImages = [
            "../images/art/1 Oleksii Pryimak 22 1.jpg",
            "../images/art/096939-Oleksii-Pryimak.jpg",
            "../images/art/1 Oleksii Pryimak 24 mural.jpg",
            "../images/art/1 Oleksii Pryimak 26 mural.jpg",
            "../images/art/1 Oleksii Pryimak 27 mural.jpg",
            "../images/art/1-Oleksii-Pryimak.jpg",
            "../images/art/156145-Oleksii-Pryimak.jpg",
            "../images/art/218852-Oleksii-Pryimak.jpg",
            "../images/art/242315-Oleksii-Pryimak.jpg",
            "../images/art/338756-Oleksii-Pryimak.jpg",
            "../images/art/394391-Oleksii-Pryimak.jpg",
            "../images/art/443023-Oleksii-Pryimak.jpg",
            "../images/art/Oleksii Pryimak 1 mural.jpg",
            "../images/art/Oleksii Pryimak 10 mural.JPG",
            "../images/art/Oleksii Pryimak 11 mural.jpg"
        ];

        let currentIndex = 0;

        document.addEventListener('DOMContentLoaded', () => {
            const gallery = document.getElementById('art-gallery');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxClose = document.getElementById('lightbox-close');
            const lightboxPrev = document.getElementById('lightbox-prev');
            const lightboxNext = document.getElementById('lightbox-next');

            // Renderowanie prostokątów
            artImages.forEach((src, index) => {
                const card = document.createElement('div');
                card.className = 'gallery-card';
                
                const img = document.createElement('img');
                img.src = src;
                img.alt = 'Artystyczne Malowanie - Oleksii Pryimak';
                
                card.appendChild(img);
                gallery.appendChild(card);

                // Otwarcie konkretnego zdjęcia
                card.addEventListener('click', () => {
                    currentIndex = index;
                    showImage(currentIndex);
                    lightbox.classList.add('active');
                });
            });

            // Wyświetlenie obrazka pod danym indeksem
            function showImage(index) {
                lightboxImg.src = artImages[index];
            }

            // Następne zdjęcie
            function nextImage() {
                currentIndex = (currentIndex + 1) % artImages.length;
                showImage(currentIndex);
            }

            // Poprzednie zdjęcie
            function prevImage() {
                currentIndex = (currentIndex - 1 + artImages.length) % artImages.length;
                showImage(currentIndex);
            }

            // Eventy dla przycisków
            lightboxNext.addEventListener('click', (e) => {
                e.stopPropagation();
                nextImage();
            });

            lightboxPrev.addEventListener('click', (e) => {
                e.stopPropagation();
                prevImage();
            });

            // Zamykanie lightboxa
            lightboxClose.addEventListener('click', () => {
                lightbox.classList.remove('active');
            });

            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    lightbox.classList.remove('active');
                }
            });

            // Obsługa strzałek na klawiaturze (Klawisze <- / -> / ESC)
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                
                if (e.key === 'ArrowRight') {
                    nextImage();
                } else if (e.key === 'ArrowLeft') {
                    prevImage();
                } else if (e.key === 'Escape') {
                    lightbox.classList.remove('active');
                }
            });
        });
    </script>

    <div class="container">
        <!-- Przycisk Powrotu -->
        <a href="https://sites.google.com/pryimak.pl/oleksii-pryimak/portfolio/artystyczne-malowanie?authuser=0" class="back-btn">
            <i class="fas fa-arrow-left"></i> Archiwum (stara strona)
        </a>
    </div>
</body>
</html>
